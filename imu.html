<html>
  <head>
    <title>BrilliantWear x PMSG | imu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/github-fork-ribbon-css/0.2.3/gh-fork-ribbon.min.css"
    />
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script>
      // FIX for aframe-orbit-controls-component
      THREE.Math = {};
      THREE.Math.radToDeg = THREE.MathUtils.radToDeg;

      THREE.Quaternion.prototype.inverse = THREE.Quaternion.prototype.invert;
      THREE.Math = THREE.MathUtils;
    </script>
    <script src="https://cdn.rawgit.com/tizzle/aframe-orbit-controls-component/v0.1.14/dist/aframe-orbit-controls-component.min.js"></script>
    <script type="module" src="./src/imu-script.js"></script>
  </head>
  <style>
    .github-fork-ribbon:before {
      background-color: #333;
    }
    a-scene {
      width: 500px;
      height: 500px;
      margin: auto;
      border-radius: 2rem;
      overflow: hidden;
      border: solid black;
      box-sizing: border-box;
    }
  </style>
  <body>
    <a
      class="github-fork-ribbon"
      href="https://github.com/brilliantsole/brilliantwear-pmsg"
      data-ribbon="View on GitHub"
      title="View on GitHub"
      target="_blank"
      >View on GitHub</a
    >

    <h1>BrilliantWear x PMSG | imu</h1>

    <button id="addDevice">add device</button>

    <br /><br />
    <button id="toggleOrientation" disabled>enable orientation</button>
    <br />
    <label>
      orientation data:
      <pre id="orientationData"></pre>
    </label>
    <br />
    <button id="toggleAcceleration" disabled>enable acceleration</button>
    <br />
    <label>
      acceleration data:
      <pre id="accelerationData"></pre>
    </label>
    <br />
    <button id="toggleTapDetector" disabled>enable tap detector</button>
    <br />
    <label>
      tap data:
      <pre id="tapDetectorData"></pre>
    </label>
    <br />

    <a-scene
      embedded
      xr-mode-ui="enabled: false;"
      device-orientation-permission-ui="enabled: false"
      renderer="colorManagement: true;"
    >
      <a-assets>
        <a-asset-item
          id="glassesModel"
          src="./assets/3d/glasses.glb"
        ></a-asset-item>
      </a-assets>

      <a-light type="directional" position="2 2 -2" target=".target"></a-light>
      <a-light type="directional" position="-2 2 2" target=".target"></a-light>
      <a-light type="directional" position="2 -2 2" target=".target"></a-light>

      <a-entity light="color: #BBB; type: ambient;"></a-entity>

      <a-camera
        class="camera"
        camera="fov: 50; zoom: 3.2;"
        position="0 0 1"
        orbit-controls="
        enableZoom: true;
        autoRotate: false;
        
        target: .target;
        enableDamping: true;
        dampingFactor: 0.125;
        rotateSpeed:0.25;
        minDistance:0.75;
        maxDistance:2;
      "
      ></a-camera>

      <a-sky color="black"></a-sky>

      <a-entity class="target">
        <a-entity class="rotation">
          <a-entity class="position" position="0 0 0.005">
            <a-entity gltf-model="#glassesModel"></a-entity>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
