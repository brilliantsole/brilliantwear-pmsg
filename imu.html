<html>
  <head>
    <title>BrilliantWear x PMSG | imu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/github-fork-ribbon-css/0.2.3/gh-fork-ribbon.min.css"
    />
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script>
      // FIX for aframe-orbit-controls-component
      THREE.Math = {};
      THREE.Math.radToDeg = THREE.MathUtils.radToDeg;

      THREE.Quaternion.prototype.inverse = THREE.Quaternion.prototype.invert;
      THREE.Math = THREE.MathUtils;
    </script>
    <script src="https://cdn.rawgit.com/tizzle/aframe-orbit-controls-component/v0.1.14/dist/aframe-orbit-controls-component.min.js"></script>
    <script type="module" src="./src/imu-script.js"></script>
  </head>
  <style>
    .github-fork-ribbon:before {
      background-color: #333;
    }
    a-scene {
      width: 500px;
      height: 500px;
      margin: auto;
      border-radius: 2rem;
      overflow: hidden;
      border: solid black;
      box-sizing: border-box;
    }
  </style>
  <body>
    <a
      class="github-fork-ribbon"
      href="https://github.com/brilliantsole/brilliantwear-pmsg"
      data-ribbon="View on GitHub"
      title="View on GitHub"
      target="_blank"
      >View on GitHub</a
    >

    <h1>BrilliantWear x PMSG | imu</h1>

    <button id="addDevice">add device</button>

    <br /><br />
    <label>
      orientation
      <select id="orientationSelect" disabled>
        <optgroup label="select orientation type">
          <option value="none">no orientation</option>
          <option value="gameRotation">game rotation</option>
          <option value="orientation">orientation</option>
          <option value="gyroscope">gyroscope</option>
        </optgroup>
      </select>
    </label>
    <br />
    <label>
      gameRotation data:
      <pre id="gameRotationData"></pre>
    </label>
    <label>
      orientation data:
      <pre id="orientationData"></pre>
    </label>
    <label>
      gyroscope data:
      <pre id="gyroscopeData"></pre>
    </label>
    <br />

    <label>
      position
      <select id="positionSelect" disabled>
        <optgroup label="select position type">
          <option value="none">no position</option>
          <option>linearAcceleration</option>
          <option>acceleration</option>
          <option>gravity</option>
        </optgroup>
      </select>
    </label>
    <br />
    <label>
      linear acceleration data:
      <pre id="linearAccelerationData"></pre>
    </label>
    <label>
      acceleration data:
      <pre id="accelerationData"></pre>
    </label>
    <label>
      gravity data:
      <pre id="gravityData"></pre>
    </label>
    <br />

    <button id="toggleTapDetector" disabled>enable tap detector</button>
    <br />
    <label>
      tap detector data:
      <pre id="tapDetectorData"></pre>
    </label>
    <br />

    <button id="toggleDeviceOrientation" disabled>
      enable device orientation
    </button>
    <br />
    <label>
      device orientation data:
      <pre id="deviceOrientationData"></pre>
    </label>
    <br />

    <button id="toggleStepDetector" disabled>enable step detector</button>
    <br />
    <label>
      step detector data:
      <pre id="stepDetectorData"></pre>
    </label>
    <br />

    <button id="toggleStepCounter" disabled>enable step counter</button>
    <br />
    <label>
      step counter data:
      <pre id="stepCounterData"></pre>
    </label>
    <br />

    <button id="toggleActivity" disabled>enable activity recognition</button>
    <br />
    <label>
      activity recognition data:
      <pre id="activityData"></pre>
    </label>
    <br />

    <button id="toggleLight" disabled>enable light sensor</button>
    <br />
    <label>
      light sensor data:
      <pre id="lightData"></pre>
    </label>
    <br />

    <div id="leds">
      <h3>Leds</h3>
      <template id="analogSingleLedTemplate">
        <div class="setLed">
          <input type="color" disabled />
          <input type="range" min="0" max="255" step="1" value="0" />
        </div>
      </template>
      <template id="digitalSingleLedTemplate">
        <div class="setLed">
          <input type="color" disabled />
          <input type="checkbox" />
        </div>
      </template>
      <template id="digitalRGBLedTemplate">
        <div class="setLed">
          <input type="color" disabled />
          <label>r<input type="checkbox" class="r" /> </label>
          <label>g<input type="checkbox" class="g" /> </label>
          <label>b<input type="checkbox" class="b" /> </label>
        </div>
      </template>
      <template id="analogRGBLedTemplate">
        <div class="setLed">
          <input type="color" />
        </div>
      </template>
    </div>

    <br />

    <div id="Vibration">
      <h3>Vibration</h3>

      <label>
        select vibration sequence
        <select id="vibrationSequenceSelect">
          <optgroup label="select vibration sequence">
            <option selected>custom</option>
            <option value="1,1000">long buzz</option>
            <option value="1,80,0,80,1,80">double click</option>
          </optgroup>
        </select>
      </label>

      <button id="triggerVibration" disabled>vibrate</button>

      <button id="addVibrationSegment">add segment</button>
      <div id="vibrationSegments">
        <template id="vibrationSegmentTemplate">
          <div class="vibrationSegment">
            <label>
              amplitude
              <input
                class="amplitude"
                type="number"
                min="0"
                max="1"
                value="0.5"
                step="0.1"
              />
            </label>
            <label>
              duration (ms)
              <input
                class="duration"
                type="number"
                min="10"
                value="100"
                step="10"
              />
            </label>
            <button class="delete">delete segment</button>
          </div>
        </template>
      </div>
    </div>

    <br />

    <a-scene
      embedded
      xr-mode-ui="enabled: false;"
      device-orientation-permission-ui="enabled: false"
      renderer="colorManagement: true;"
    >
      <a-assets>
        <a-asset-item
          id="glassesModel"
          src="./assets/3d/glasses.glb"
        ></a-asset-item>
      </a-assets>

      <a-light type="directional" position="2 2 -2" target=".target"></a-light>
      <a-light type="directional" position="-2 2 2" target=".target"></a-light>
      <a-light type="directional" position="2 -2 2" target=".target"></a-light>

      <a-entity light="color: #BBB; type: ambient;"></a-entity>

      <a-camera
        class="camera"
        camera="fov: 50; zoom: 3.2;"
        position="0 0 1"
        orbit-controls="
        enableZoom: true;
        autoRotate: false;
        
        target: .target;
        enableDamping: true;
        dampingFactor: 0.125;
        rotateSpeed:0.25;
        minDistance:0.75;
        maxDistance:2;
      "
      ></a-camera>

      <a-sky color="black"></a-sky>

      <a-entity class="target">
        <a-entity class="rotation">
          <a-entity class="position" position="0 0 0.005">
            <a-entity gltf-model="#glassesModel"></a-entity>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
