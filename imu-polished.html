<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BrilliantWear x PMSG | imu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
    />
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script>
      // FIX for aframe-orbit-controls-component
      THREE.Math = {};
      THREE.Math.radToDeg = THREE.MathUtils.radToDeg;
      THREE.Quaternion.prototype.inverse = THREE.Quaternion.prototype.invert;
      THREE.Math = THREE.MathUtils;
    </script>
    <script src="https://cdn.rawgit.com/tizzle/aframe-orbit-controls-component/v0.1.14/dist/aframe-orbit-controls-component.min.js"></script>
    <style>
      :root {
        --bg: #090b10;
        --panel: #13161e;
        --ink: #eef1f7;
        --mute: #8a92a6;
        --line: #232836;
        --soft: #1b1f2b;
        --accent: #7a86ff;
        --accent2: #38e1c6;
        --ok: #38e1c6;
        --r: 18px;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(900px 500px at 12% -10%, #1b2250 0%, transparent 60%),
          radial-gradient(700px 480px at 100% 0%, #0f3b3a 0%, transparent 55%), var(--bg);
        background-attachment: fixed;
        color: var(--ink);
        font: 15px/1.45 Figtree, system-ui, sans-serif;
      }
      button, select, input { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      header {
        display: flex;
        align-items: center;
        gap: 16px;
        max-width: 1280px;
        margin: 0 auto;
        padding: 18px 24px;
      }
      header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 12px; }
      header h1::before {
        content: "";
        width: 34px; height: 20px;
        border-radius: 10px 10px 12px 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        box-shadow: 0 0 22px #7a86ff66;
        -webkit-mask: radial-gradient(circle 6px at 9px 10px, #0000 98%, #000) , radial-gradient(circle 6px at 25px 10px, #0000 98%, #000);
        -webkit-mask-composite: source-in;
        mask: radial-gradient(circle 6px at 9px 10px, #0000 98%, #000), radial-gradient(circle 6px at 25px 10px, #0000 98%, #000);
        mask-composite: intersect;
      }
      header h1 span { color: var(--accent2); font-weight: 600; font-size: 13px; border: 1px solid #38e1c655; border-radius: 99px; padding: 1px 9px; }
      header .gh { color: var(--mute); font-size: 13px; text-decoration: none; }
      header .gh:hover { color: var(--ink); }
      .spacer { flex: 1; }
      .status { display: flex; align-items: center; gap: 8px; color: var(--mute); font-size: 14px; }
      .status i { width: 9px; height: 9px; border-radius: 50%; background: #c3c9d4; }
      body.connected .status i { background: var(--ok); box-shadow: 0 0 0 4px #38e1c61f, 0 0 14px var(--ok); }
      body.connected .status { color: var(--ink); }

      .btn {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 10px;
        padding: 8px 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn:hover:not(:disabled) { border-color: #3a4156; background: var(--soft); }
      .btn.primary { background: linear-gradient(135deg, #6f7dff, #4f5bf0); border-color: transparent; color: #fff; box-shadow: 0 6px 20px #5864f044; }
      .btn.primary:hover:not(:disabled) { filter: brightness(1.1); background: linear-gradient(135deg, #6f7dff, #4f5bf0); }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }
      

      .app {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(360px, 0.9fr);
        gap: 20px;
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 24px 40px;
        align-items: start;
      }
      .stage {
        position: sticky;
        top: 20px;
        height: calc(100vh - 110px);
        min-height: 420px;
        border-radius: 24px;
        overflow: hidden;
        background: #05060a;
        border: 1px solid #2a3046;
        box-shadow: 0 30px 80px #0009, 0 0 80px #7a86ff1f, inset 0 0 60px #7a86ff10;
      }
      a-scene { width: 100%; height: 100%; }
      .hint {
        position: absolute;
        left: 16px;
        bottom: 14px;
        z-index: 5;
        color: #ffffffb3;
        font-size: 12.5px;
        background: #0008;
        backdrop-filter: blur(8px);
        border: 1px solid #ffffff1c;
        border-radius: 99px;
        padding: 5px 12px;
        pointer-events: none;
      }

      .side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
      .panel { background: linear-gradient(180deg, #171a24, var(--panel)); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: 0 10px 30px #0006; }
      .panel h2 { margin: 0 0 16px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
      .panel h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: linear-gradient(var(--accent), var(--accent2)); }
      .group + .group { margin-top: 18px; }
      .group > span { display: block; font-size: 13px; color: var(--mute); margin-bottom: 6px; }

      .seg { display: flex; flex-wrap: wrap; gap: 2px; background: var(--soft); border-radius: 12px; padding: 3px; border: 1px solid var(--line); }
      .seg label { flex: 1 1 auto; position: relative; }
      .seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
      .seg span {
        display: block;
        text-align: center;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 13.5px;
        font-weight: 500;
        color: var(--mute);
        white-space: nowrap;
      }
      .seg input:checked + span { background: linear-gradient(135deg, #5b66e6, #7a86ff); color: #fff; font-weight: 600; box-shadow: 0 4px 14px #5864f055; }
      .seg input:disabled { cursor: not-allowed; }
      .seg input:disabled + span { opacity: 0.45; }
      .seg input:focus-visible + span { outline: 2px solid var(--accent); }

      .vals {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 22px;
        margin-top: 10px;
        min-height: 40px;
        font-family: "Geist Mono", ui-monospace, monospace;
      }
      .vals div { display: flex; flex-direction: column; }
      .vals small { font-size: 11.5px; color: var(--mute); }
      .vals b { font-weight: 500; font-size: 16px; min-width: 56px; color: var(--accent2); }
      .vals .idle { color: var(--mute); font: 14px Figtree, sans-serif; align-self: center; }

      .row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 10px 0; }
      .row + .row { border-top: 1px solid var(--line); }
      .row .val { font-family: "Geist Mono", ui-monospace, monospace; font-size: 14px; color: var(--mute); text-align: right; }
      .row .val.live { color: var(--accent2); }

      input[type="checkbox"], button[role="switch"] {
        appearance: none;
        -webkit-appearance: none;
        flex: none;
        width: 36px;
        height: 20px;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 99px;
        background: #2c3345;
        position: relative;
        cursor: pointer;
        transition: background 0.15s;
      }
      input[type="checkbox"]::after, button[role="switch"]::after {
        content: "";
        position: absolute;
        top: 2px; left: 2px;
        width: 16px; height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px #0006;
        transition: transform 0.15s;
      }
      input[type="checkbox"]:checked, button[role="switch"][aria-checked="true"] { background: linear-gradient(135deg, #5b66e6, var(--accent2)); }
      input[type="checkbox"]:checked::after, button[role="switch"][aria-checked="true"]::after { transform: translateX(16px); }
      input:disabled, button:disabled { cursor: not-allowed; }
      button[role="switch"]:disabled { opacity: 0.45; }

      input[type="range"] { accent-color: var(--accent); width: 100%; min-width: 0; }
      input[type="color"] {
        appearance: none;
        -webkit-appearance: none;
        width: 34px; height: 34px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: none;
        cursor: pointer;
        flex: none;
        box-shadow: 0 0 0 3px #ffffff0d;
      }
      input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
      input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 50%; }
      input[type="color"]::-moz-color-swatch { border: 0; border-radius: 50%; }
      input[type="color"]:disabled { cursor: default; }

      .led { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
      .led + .led { border-top: 1px solid var(--line); }
      .led .name { width: 52px; flex: none; font-size: 14px; }
      .led .ch { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mute); }
      .empty { margin: 0; color: var(--mute); font-size: 14px; }

      .vib-top { display: flex; gap: 10px; flex-wrap: wrap; }
      select {
        flex: 1;
        min-width: 140px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 10px;
        background: var(--soft);
      }
      .wave {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 64px;
        margin: 14px 0;
        padding: 8px;
        border-radius: 12px;
        background: #0d1017;
        border: 1px solid var(--line);
      }
      .wave i { background: linear-gradient(var(--accent2), var(--accent)); border-radius: 3px; min-width: 3px; box-shadow: 0 0 12px #7a86ff55; }
      .wave .empty { align-self: center; margin: 0 auto; }
      .vseg { display: grid; grid-template-columns: 22px 1fr 108px 32px; align-items: end; gap: 12px; padding: 8px 0; }
      .vseg + .vseg { border-top: 1px solid var(--line); }
      .vseg .idx { color: var(--mute); font-size: 13px; padding-bottom: 7px; }
      .vseg label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--mute); position: relative; }
      .vseg output { position: absolute; right: 0; top: 0; font-family: "Geist Mono", monospace; }
      .vseg .unit { display: flex; align-items: center; gap: 6px; }
      .vseg input[type="number"] { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: var(--soft); }
      .vseg em { font-style: normal; color: var(--mute); }
      .icon { width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; font-size: 20px; line-height: 1; color: var(--mute); cursor: pointer; }
      .icon:hover { background: #3a1d24; color: #ff7b8a; }
      .vib-actions { display: flex; gap: 10px; margin-top: 12px; }

      @media (max-width: 900px) {
        .app { grid-template-columns: 1fr; padding: 0 14px 32px; }
        header { padding: 14px; flex-wrap: wrap; }
        .stage { position: relative; top: 0; height: 72vw; min-height: 320px; }
        .vseg { grid-template-columns: 22px 1fr 96px 32px; gap: 8px; }
      }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body>
    <header>
      <h1>BrilliantWear × PMSG<span>IMU</span></h1>
      <a
        class="gh"
        href="https://github.com/brilliantsole/brilliantwear-pmsg"
        target="_blank"
        rel="noopener"
        >GitHub</a
      >
      <div class="spacer"></div>
      <div class="status" role="status"><i></i><span id="statusText">Not connected</span></div>
      <button id="addDevice" class="btn primary" disabled>Connect glasses</button>
    </header>

    <main class="app">
      <div class="stage">
        <div class="hint">Drag to orbit, scroll to zoom</div>
        <a-scene
          embedded
          xr-mode-ui="enabled: false;"
          device-orientation-permission-ui="enabled: false"
          renderer="colorManagement: true;"
        >
          <a-assets>
            <a-asset-item id="glassesModel" src="./assets/3d/glasses.glb"></a-asset-item>
          </a-assets>

          <a-light type="directional" position="2 2 -2" target=".target"></a-light>
          <a-light type="directional" position="-2 2 2" target=".target"></a-light>
          <a-light type="directional" position="2 -2 2" target=".target"></a-light>
          <a-entity light="color: #BBB; type: ambient;"></a-entity>

          <a-camera
            class="camera"
            camera="fov: 50; zoom: 3.2;"
            position="0 0 1"
            orbit-controls="
              enableZoom: true;
              autoRotate: false;
              target: .target;
              enableDamping: true;
              dampingFactor: 0.125;
              rotateSpeed:0.25;
              minDistance:0.75;
              maxDistance:2;
            "
          ></a-camera>

          <a-sky color="#05060a"></a-sky>

          <a-entity class="target">
            <a-entity class="rotation">
              <a-entity class="position" position="0 0 0.005">
                <a-entity gltf-model="#glassesModel"></a-entity>
              </a-entity>
            </a-entity>
          </a-entity>
        </a-scene>
      </div>

      <div class="side">
        <section class="panel">
          <h2>Motion</h2>
          <div id="motion"></div>
        </section>

        <section class="panel">
          <h2>Sensors</h2>
          <div id="toggles"></div>
        </section>

        <section class="panel">
          <h2>LEDs</h2>
          <div id="leds"><p class="empty">Connect your glasses to control their LEDs.</p></div>
        </section>

        <section class="panel">
          <h2>Vibration</h2>
          <div class="vib-top">
            <select id="vibrationSequenceSelect" aria-label="Vibration preset">
              <option value="custom" selected>Custom sequence</option>
              <option value="1,1000">Long buzz</option>
              <option value="1,80,0,80,1,80">Double click</option>
            </select>
          </div>
          <div class="wave" id="wave"></div>
          <div id="vibrationSegments"></div>
          <div class="vib-actions">
            <button id="addVibrationSegment" class="btn">Add segment</button>
            <button id="triggerVibration" class="btn primary" disabled>Vibrate</button>
          </div>
        </section>
      </div>
    </main>

    <script type="module">
      import * as BW from "./src/brilliantwear/brilliantwear.module.min.js";
      window.BW = BW;

      const $ = (s, r = document) => r.querySelector(s);
      const RATE = 20;

      // DEVICE HELPERS
      const isDevicePMSG = (device) => device.deviceInformation.modelNumber == "PMSG";
      const getPMSGDevice = () => BW.DeviceManager.connectedDevices.find(isDevicePMSG);
      /** @param {(device: BW.Device, isConnected: boolean) => void} callback */
      const onConnectionChange = (callback) => {
        BW.DeviceManager.addEventListener("deviceConnected", (event) => {
          const { device } = event.message;
          if (isDevicePMSG(device)) callback(device, true);
        });
        BW.DeviceManager.addEventListener("deviceNotConnected", (event) => {
          const { device } = event.message;
          if (isDevicePMSG(device) && !getPMSGDevice()) callback(device, false);
        });
      };

      // CONNECTION
      const addDeviceButton = $("#addDevice");
      const statusText = $("#statusText");
      const setButton = (text, disabled) => {
        addDeviceButton.textContent = text;
        addDeviceButton.disabled = disabled;
      };
      const canConnect = await BW.Device.CanConnect;
      addDeviceButton.disabled = !canConnect;
      if (!canConnect) statusText.textContent = "Bluetooth isn't available in this browser";

      addDeviceButton.addEventListener("click", async () => {
        let device = getPMSGDevice();
        if (device) {
          setButton("Disconnecting…", true);
          await device.disconnect();
          return;
        }
        setButton("Connecting…", true);
        device = await BW.Device.Connect();
        if (device && !isDevicePMSG(device)) {
          window.alert("device isn't PMSG - disconnecting now");
          await device.disconnect();
        }
        if (!getPMSGDevice()) setButton("Connect glasses", false);
      });

      onConnectionChange((device, isConnected) => {
        document.body.classList.toggle("connected", isConnected);
        statusText.textContent = isConnected ? "Connected" : "Not connected";
        addDeviceButton.classList.toggle("primary", !isConnected);
        setButton(isConnected ? "Disconnect" : "Connect glasses", false);
      });

      // A-FRAME
      const scene = $("a-scene");
      const targetEntity = scene.querySelector(".target");
      const targetPositionEntity = targetEntity.querySelector(".position");
      const modelEntity = targetEntity.querySelector("[gltf-model]");

      const ledEntityLights = [];
      const ledMeshes = [];
      const ledMaterials = [];
      modelEntity.addEventListener("model-loaded", () => {
        const model = modelEntity.getObject3D("mesh");
        if (!model) return;
        model.traverse((_model) => {
          if (_model.name.startsWith("LED_")) ledMeshes.push(_model);
        });
        ledMeshes.sort((a, b) => +a.name.split("_")[1] - +b.name.split("_")[1]);
        ledMeshes.forEach((ledMesh, index) => {
          ledMaterials[index] = new THREE.MeshBasicMaterial({ color: 0x000000 });
          ledMesh.material = ledMaterials[index];

          const ledEntity = document.createElement("a-light");
          const ledPosition = new THREE.Vector3(-0.002, 0, 0).add(ledMesh.position);
          ledEntity.setAttribute("position", ledPosition.toArray().join(" "));
          ledEntity.setAttribute("type", "point");
          ledEntity.setAttribute("color", "black");
          ledEntity.setAttribute("decay", "1");
          ledEntity.setAttribute("intensity", "0.1");
          ledEntity.setAttribute("distance", "0.1");
          ledEntity.addEventListener("loaded", () => {
            ledEntityLights[index] = ledEntity.getObject3D("light");
          });
          modelEntity.appendChild(ledEntity);
        });
      });

      const updateLed = (index, color) => {
        if (!ledMaterials[index]) {
          console.error(`invalid ledMaterials index ${index}`);
          return;
        }
        ledMaterials[index].color.set(color);
        ledEntityLights[index]?.color.set(color);
      };
      const updateTargetPositionEntityPosition = (acceleration) => {
        const { x, y, z } = acceleration ?? { x: 0, y: 0, z: 0 };
        targetPositionEntity.object3D.position.set(x, y, z).multiplyScalar(0.05);
      };
      const updateTargetRotationEntityEuler = (orientation) => {
        const { pitch, heading, roll } = orientation ?? { pitch: 0, heading: 0, roll: 0 };
        targetPositionEntity.object3D.rotation.set(
          THREE.MathUtils.degToRad(pitch),
          THREE.MathUtils.degToRad(heading),
          THREE.MathUtils.degToRad(roll),
          "YXZ",
        );
      };
      const updateTargetRotationEntityQuaternion = ({ x, y, z, w }) => {
        targetPositionEntity.object3D.quaternion.set(x, y, z, w);
      };

      // MOTION (rotation + position sources)
      const fmtNum = (n) => (Number.isInteger(n) ? n : n.toFixed(2));
      const renderValues = (v) =>
        v && typeof v == "object"
          ? Object.entries(v)
              .map(([k, x]) => `<div><small>${k}</small><b>${typeof x == "number" ? fmtNum(x) : x}</b></div>`)
              .join("")
          : `<div><b>${v}</b></div>`;
      const idleValues = `<span class="idle">No data</span>`;

      const motionGroups = [
        {
          id: "rotation",
          title: "Rotation",
          types: { gameRotation: "Game rotation", orientation: "Orientation", gyroscope: "Gyroscope" },
          apply: {
            gameRotation: (v) => updateTargetRotationEntityQuaternion(v),
            orientation: (v) => updateTargetRotationEntityEuler(v),
            gyroscope: (g) => updateTargetRotationEntityEuler({ pitch: g.x, heading: g.y, roll: g.z }),
          },
          reset: () => updateTargetRotationEntityEuler(),
        },
        {
          id: "position",
          title: "Position",
          types: { linearAcceleration: "Linear", acceleration: "Acceleration", gravity: "Gravity" },
          apply: Object.fromEntries(
            ["linearAcceleration", "acceleration", "gravity"].map((t) => [t, (v) => updateTargetPositionEntityPosition(v)]),
          ),
          reset: () => updateTargetPositionEntityPosition(),
        },
      ];

      motionGroups.forEach((group) => {
        const el = document.createElement("div");
        el.className = "group";
        const options = ["none", ...Object.keys(group.types)];
        el.innerHTML = `
          <span>${group.title}</span>
          <div class="seg" role="radiogroup" aria-label="${group.title} source">
            ${options
              .map(
                (t) => `<label><input type="radio" name="${group.id}" value="${t}" disabled ${t == "none" ? "checked" : ""}><span>${
                  t == "none" ? "Off" : group.types[t]
                }</span></label>`,
              )
              .join("")}
          </div>
          <div class="vals">${idleValues}</div>`;
        $("#motion").append(el);
        group.vals = $(".vals", el);
        group.radios = [...el.querySelectorAll("input")];
        group.radios.forEach((radio) =>
          radio.addEventListener("change", () => {
            getPMSGDevice()?.setSensorConfiguration(
              Object.fromEntries(Object.keys(group.types).map((t) => [t, t == radio.value ? RATE : 0])),
            );
          }),
        );
      });

      onConnectionChange((device, isConnected) => {
        motionGroups.forEach((group) => {
          group.radios.forEach((radio) => {
            radio.disabled = !isConnected || (radio.value != "none" && !device.hasSensorType(radio.value));
          });
          if (!isConnected) {
            group.radios[0].checked = true;
            group.vals.innerHTML = idleValues;
          }
        });
        if (!isConnected) return;

        motionGroups.forEach((group) => {
          Object.keys(group.types).forEach((type) => {
            device.addEventListener(
              type,
              (event) => {
                const value = event.message[type];
                group.vals.innerHTML = renderValues(value);
                group.apply[type](value, event.message.timestamp);
              },
              device.connectionAbortSignalObject,
            );
          });
        });
        device.addEventListener(
          "getSensorConfiguration",
          () => {
            motionGroups.forEach((group) => {
              group.reset();
              const active = Object.keys(group.types).find((t) => device.sensorConfiguration[t] > 0) ?? "none";
              group.radios.forEach((radio) => (radio.checked = radio.value == active));
              if (active == "none") group.vals.innerHTML = idleValues;
            });
          },
          device.connectionAbortSignalObject,
        );
      });

      // TOGGLE SENSORS
      let counts = {};
      const humanize = (s) => s.replace(/([A-Z])/g, " $1").toLowerCase();
      const toggleSensors = [
        ["tapDetector", "Tap detector", (_, key) => `tap ×${(counts[key] = (counts[key] ?? 0) + 1)}`],
        ["deviceOrientation", "Device orientation", (v) => humanize(v)],
        ["stepDetector", "Step detector", (_, key) => `step ×${(counts[key] = (counts[key] ?? 0) + 1)}`],
        ["stepCounter", "Step counter", (v) => `${v} steps`],
        ["activity", "Activity recognition", (v) => (v.still ? "still" : "moving")],
        ["light", "Light sensor", (v) => fmtNum(v)],
      ];
      const toggleRows = toggleSensors.map(([key, label, format]) => {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `<button class="switch" role="switch" aria-checked="false" aria-label="${label}" disabled></button><span>${label}</span><span class="val">—</span>`;
        $("#toggles").append(row);
        const button = $("button", row);
        const val = $(".val", row);
        button.addEventListener("click", () => getPMSGDevice()?.toggleSensor(key, RATE));
        return { key, format, button, val };
      });

      onConnectionChange((device, isConnected) => {
        const update = () => {
          toggleRows.forEach(({ key, button, val }) => {
            const supported = isConnected && device.hasSensorType(key);
            const on = supported && device.sensorConfiguration[key] > 0;
            button.disabled = !supported;
            button.title = isConnected && !supported ? "Not supported on this device" : "";
            button.setAttribute("aria-checked", on);
            if (!on) {
              val.textContent = "—";
              val.classList.remove("live");
              counts[key] = 0;
            }
          });
        };
        update();
        if (!isConnected) return;
        device.addEventListener("getSensorConfiguration", update, device.connectionAbortSignalObject);
        toggleRows.forEach(({ key, format, val }) => {
          device.addEventListener(
            key,
            (event) => {
              val.textContent = format(event.message[key], key);
              val.classList.add("live");
            },
            device.connectionAbortSignalObject,
          );
        });
      });

      // LEDS
      const setLedInterval = 20;
      const ledsContainer = $("#leds");
      const ledEmpty = `<p class="empty">Connect your glasses to control their LEDs.</p>`;
      const colorInput = `<input type="color" disabled aria-label="LED color" />`;
      const ledControls = {
        analogSingle: `${colorInput}<input type="range" min="0" max="255" step="1" value="0" aria-label="Brightness" />`,
        digitalSingle: `${colorInput}<input type="checkbox" aria-label="On" />`,
        digitalRGB: `${colorInput}${["r", "g", "b"]
          .map((c) => `<label class="ch">${c}<input type="checkbox" class="${c}" /></label>`)
          .join("")}`,
        analogRGB: `<input type="color" aria-label="LED color" />`,
      };
      /** @type {{range?: HTMLInputElement, colorInput?: HTMLInputElement, checkbox?: HTMLInputElement}[]} */
      let setLedContainers = [];

      onConnectionChange((device, isConnected) => {
        ledsContainer.innerHTML = ledEmpty;
        setLedContainers = [];
        if (!isConnected) return;
        ledsContainer.innerHTML = "";

        device.leds.forEach((led, index) => {
          const el = document.createElement("div");
          el.className = "led";
          el.innerHTML = `<span class="name">LED ${index}</span>${ledControls[led.type]}`;
          const range = el.querySelector(`input[type="range"]`);
          const color = el.querySelector(`input[type="color"]`);
          const checkbox = el.querySelector(`input[type="checkbox"]`);

          const throttled = (fn) => BW.ThrottleUtils.throttle(fn, setLedInterval, true);
          range?.addEventListener(
            "input",
            throttled(() => range.isChanging && device.setLed({ index, brightness: +range.value })),
          );
          color?.addEventListener(
            "input",
            throttled(() => color.isChanging && device.setLed({ index, color: color.value })),
          );
          checkbox?.addEventListener(
            "input",
            throttled(() => checkbox.isChanging && device.setLed({ index, brightness: checkbox.checked ? 255 : 0 })),
          );
          if (color?.disabled) color.value = BW.rgbToHex(led.maxColor);

          [range, color, checkbox].forEach((input) => {
            if (!input) return;
            input.addEventListener("focusin", () => (input.isChanging = true));
            input.addEventListener("focusout", () => (input.isChanging = false));
            input.addEventListener("mousedown", () => (input.isChanging = true));
            if (input.type != "color") input.addEventListener("change", () => (input.isChanging = false));
          });

          setLedContainers[index] = { range, colorInput: color, checkbox };
          ledsContainer.appendChild(el);
        });

        device.addEventListener(
          "setLed",
          (event) => {
            const { ledIndex, led } = event.message;
            updateLed(ledIndex, BW.rgbToHex(led.color));
            const { range, checkbox, colorInput: color } = setLedContainers[ledIndex] ?? {};
            if (color && !color.disabled && !color.isChanging) color.value = BW.rgbToHex(led.color);
            if (checkbox && !checkbox.isChanging) checkbox.checked = BW.projectColor(led.color, led.maxColor) > 0;
            if (range && !range.isChanging) range.value = BW.projectColor(led.color, led.maxColor) * 255;
          },
          device.connectionAbortSignalObject,
        );
      });

      // HAPTICS
      /** @type {BW.VibrationWaveformSegment[]} */
      const vibrationSegments = [];
      const segmentsContainer = $("#vibrationSegments");
      const waveEl = $("#wave");
      const addSegmentButton = $("#addVibrationSegment");
      const triggerButton = $("#triggerVibration");
      const presetSelect = $("#vibrationSequenceSelect");

      const updateTriggerButton = () => {
        triggerButton.disabled = !getPMSGDevice() || !vibrationSegments.length;
      };
      const markCustom = () => (presetSelect.value = "custom");

      const renderWave = () => {
        waveEl.innerHTML = vibrationSegments.length
          ? vibrationSegments
              .map((s) => `<i style="flex:${Math.max(s.duration, 10)};height:${Math.max(s.amplitude * 100, 4)}%"></i>`)
              .join("")
          : `<p class="empty">Add a segment or pick a preset.</p>`;
        updateTriggerButton();
      };

      const renderSegments = () => {
        addSegmentButton.disabled = vibrationSegments.length >= BW.MaxNumberOfVibrationWaveformSegments;
        segmentsContainer.innerHTML = "";
        vibrationSegments.forEach((segment, i) => {
          const row = document.createElement("div");
          row.className = "vseg";
          row.innerHTML = `
            <span class="idx">${i + 1}</span>
            <label>Amplitude
              <output>${segment.amplitude}</output>
              <input class="amplitude" type="range" min="0" max="1" step="0.1" value="${segment.amplitude}" />
            </label>
            <label>Duration
              <span class="unit"><input class="duration" type="number" min="10" max="${BW.MaxVibrationWaveformSegmentDuration}" step="10" value="${segment.duration}" /><em>ms</em></span>
            </label>
            <button class="icon" aria-label="Delete segment ${i + 1}">×</button>`;
          const output = $("output", row);
          $(".amplitude", row).addEventListener("input", (event) => {
            segment.amplitude = +event.target.value;
            output.textContent = segment.amplitude;
            markCustom();
            renderWave();
          });
          $(".duration", row).addEventListener("input", (event) => {
            segment.duration = +event.target.value;
            markCustom();
            renderWave();
          });
          $(".icon", row).addEventListener("click", () => {
            vibrationSegments.splice(vibrationSegments.indexOf(segment), 1);
            markCustom();
            renderSegments();
          });
          segmentsContainer.appendChild(row);
        });
        renderWave();
      };

      addSegmentButton.addEventListener("click", () => {
        vibrationSegments.push({ amplitude: 0.5, duration: 500 });
        markCustom();
        renderSegments();
      });

      triggerButton.addEventListener("click", () => {
        getPMSGDevice()?.triggerVibration({ type: "waveform", segments: vibrationSegments });
      });
      onConnectionChange(updateTriggerButton);

      presetSelect.addEventListener("input", () => {
        const value = presetSelect.value;
        if (value == "custom") return;
        vibrationSegments.length = 0;
        value.split(",").forEach((amplitudeOrDuration, index) => {
          if (index % 2) vibrationSegments.at(-1).duration = +amplitudeOrDuration;
          else vibrationSegments.push({ amplitude: +amplitudeOrDuration, duration: 0 });
        });
        renderSegments();
      });

      renderSegments();
    </script>
  </body>
</html>
