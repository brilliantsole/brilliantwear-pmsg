<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BrilliantWear x PMSG | imu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap"
      rel="stylesheet"
    />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <style>
      :root {
        --paper: #e8ebf2;
        --panel: #f7f8fb;
        --ink: #1a1f33;
        --muted: #6a7188;
        --line: #d5d9e6;
        --accent: #3a45f5;
        --tap: #ff6b3d;
        --ok: #1f9d6b;
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: var(--paper); }
      .app {
        display: grid;
        grid-template-columns: 1fr 390px;
        height: 100%;
      }
      .stage { position: relative; min-height: 0; overflow: hidden;
        background: radial-gradient(ellipse at 50% 45%, #fff 0%, #dfe3ee 70%); }
      #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      .pulse { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px;
        border-radius: 50%; border: 3px solid var(--tap); opacity: 0; pointer-events: none; }
      .pulse.go { animation: pulse 0.7s ease-out; }
      @keyframes pulse { from { opacity: 0.9; transform: scale(0.4); } to { opacity: 0; transform: scale(3.2); } }
      .hint { position: absolute; left: 1.25rem; bottom: 1rem; font-size: 0.85rem; color: var(--muted); }
      .reset { position: absolute; right: 1.25rem; bottom: 0.9rem; }

      .panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
        padding: 1.75rem 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
      h1 { margin: 0; font-size: 2rem; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; }
      .sub { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.95rem; }
      .conn { display: flex; align-items: center; gap: 0.75rem; }
      .status { display: flex; align-items: center; gap: 0.45rem; font-size: 0.9rem; color: var(--muted); margin-left: auto; }
      .dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: #b3b8c9; }
      .on .dot { background: var(--ok); box-shadow: 0 0 0 4px #1f9d6b26; }

      button { font: inherit; cursor: pointer; }
      .btn { border: 0; border-radius: 999px; padding: 0.65rem 1.2rem; background: var(--ink); color: #fff; font-weight: 600; }
      .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); padding: 0.4rem 0.9rem; font-size: 0.85rem; }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }
      button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

      .sensor { border-top: 1px solid var(--line); padding-top: 1rem; }
      .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.7rem; }
      .head h2 { margin: 0; font-size: 1.05rem; font-weight: 600; }
      .switch { position: relative; width: 2.8rem; height: 1.55rem; border-radius: 999px; border: 0; background: #c3c8d8; transition: background 0.2s; }
      .switch::after { content: ""; position: absolute; top: 0.2rem; left: 0.2rem; width: 1.15rem; height: 1.15rem;
        border-radius: 50%; background: #fff; transition: transform 0.2s; }
      .switch[aria-checked="true"] { background: var(--accent); }
      .switch[aria-checked="true"]::after { transform: translateX(1.25rem); }
      .switch:disabled { opacity: 0.4; cursor: not-allowed; }

      .row { display: grid; grid-template-columns: 4.2rem 1fr 4.6rem; align-items: center; gap: 0.6rem; margin: 0.4rem 0; font-size: 0.9rem; }
      .row span:first-child { color: var(--muted); }
      .row b { text-align: right; font-weight: 600; }
      .track { position: relative; height: 0.5rem; border-radius: 999px; background: #e3e6f0; }
      .track::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: #aab0c4; }
      .fill { position: absolute; top: 0; bottom: 0; left: 50%; width: 0; border-radius: 999px; background: var(--accent); }
      .empty { color: var(--muted); font-size: 0.9rem; margin: 0; }
      .tapcount { font-size: 2.6rem; font-weight: 800; line-height: 1; color: var(--tap); }
      .tapmeta { color: var(--muted); font-size: 0.85rem; margin-top: 0.3rem; }
      footer { margin-top: auto; font-size: 0.85rem; }
      footer a { color: var(--muted); }

      @media (max-width: 800px) {
        .app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; min-height: 100%; }
        .panel { border-left: 0; border-top: 1px solid var(--line); }
      }
      @media (prefers-reduced-motion: reduce) { .pulse.go { animation: none; } .switch, .switch::after { transition: none; } }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="stage">
        <canvas id="view"></canvas>
        <div class="pulse" id="pulse"></div>
        <span class="hint">Drag to look around, scroll to zoom</span>
        <button class="btn ghost reset" id="resetView">Reset view</button>
      </div>

      <aside class="panel">
        <header>
          <h1>Glasses motion</h1>
          <p class="sub">BrilliantWear × PMSG live sensor view</p>
        </header>

        <div class="conn" id="conn">
          <button class="btn" id="addDevice">Connect glasses</button>
          <span class="status"><i class="dot"></i><span id="statusText">Not connected</span></span>
        </div>

        <section class="sensor">
          <div class="head">
            <h2>Orientation</h2>
            <button class="switch" role="switch" aria-checked="false" aria-label="Orientation" id="toggleOrientation" disabled></button>
          </div>
          <div id="orientationData"><p class="empty">Turn on to see the glasses’ angles.</p></div>
        </section>

        <section class="sensor">
          <div class="head">
            <h2>Acceleration</h2>
            <button class="switch" role="switch" aria-checked="false" aria-label="Acceleration" id="toggleAcceleration" disabled></button>
          </div>
          <div id="accelerationData"><p class="empty">Turn on to see movement on each axis.</p></div>
        </section>

        <section class="sensor">
          <div class="head">
            <h2>Taps</h2>
            <button class="switch" role="switch" aria-checked="false" aria-label="Tap detector" id="toggleTapDetector" disabled></button>
          </div>
          <div class="tapcount" id="tapCount">0</div>
          <div class="tapmeta" id="tapMeta">Turn on, then tap the glasses.</div>
        </section>

        <footer><a href="https://github.com/brilliantsole/brilliantwear-pmsg" target="_blank" rel="noopener">View on GitHub</a></footer>
      </aside>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import * as BW from "./src/brilliantwear/brilliantwear.module.min.js";

      window.BW = BW;
      const $ = (id) => document.getElementById(id);

      // ---------- DEVICE HELPERS ----------
      const isDevicePMSG = (device) =>
        device.deviceInformation.modelNumber == "PMSG" &&
        device.hasSensorType("acceleration") &&
        device.hasSensorType("orientation") &&
        device.hasSensorType("tapDetector");
      const getDevice = () => BW.DeviceManager.connectedDevices.find(isDevicePMSG);

      const onPMSGDeviceIsConnected = (callback) => {
        BW.DeviceManager.addEventListener("deviceConnected", (e) => {
          const { device } = e.message;
          if (isDevicePMSG(device)) callback(device, true);
        });
        BW.DeviceManager.addEventListener("deviceNotConnected", (e) => {
          const { device } = e.message;
          if (isDevicePMSG(device) && !getDevice()) callback(device, false);
        });
      };

      // ---------- CONNECTION ----------
      const addDeviceButton = $("addDevice");
      addDeviceButton.disabled = !(await BW.Device.CanConnect);
      addDeviceButton.addEventListener("click", async () => {
        let device = getDevice();
        if (device) {
          addDeviceButton.disabled = true;
          addDeviceButton.innerText = "Disconnecting…";
          await device.disconnect();
          return;
        }
        addDeviceButton.disabled = true;
        addDeviceButton.innerText = "Connecting…";
        device = await BW.Device.Connect();
        if (device) {
          if (!isDevicePMSG(device)) {
            window.alert("This device isn’t a PMSG. Disconnecting now.");
            await device.disconnect();
          }
        } else {
          addDeviceButton.innerText = "Connect glasses";
        }
        addDeviceButton.disabled = false;
      });

      onPMSGDeviceIsConnected(() => {
        const has = Boolean(getDevice());
        addDeviceButton.innerText = has ? "Disconnect" : "Connect glasses";
        addDeviceButton.disabled = false;
        $("conn").classList.toggle("on", has);
        $("statusText").textContent = has ? "Connected" : "Not connected";
      });

      // ---------- THREE.JS ----------
      const canvas = $("view");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 10);
      const HOME = new THREE.Vector3(0, 0.04, 0.55);
      camera.position.copy(HOME);

      const controls = new OrbitControls(camera, canvas);
      Object.assign(controls, { enableDamping: true, dampingFactor: 0.125, rotateSpeed: 0.5, minDistance: 0.3, maxDistance: 1.2, enablePan: false });
      $("resetView").addEventListener("click", () => { camera.position.copy(HOME); controls.target.set(0, 0, 0); controls.update(); });

      scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa3c0, 1.2));
      [[2, 2, -2], [-2, 2, 2], [2, -2, 2]].forEach((p) => {
        const l = new THREE.DirectionalLight(0xffffff, 1.4);
        l.position.set(...p);
        scene.add(l);
      });

      // soft contact shadow under the glasses
      const shadow = new THREE.Mesh(
        new THREE.CircleGeometry(0.11, 48),
        new THREE.MeshBasicMaterial({ color: 0x1a1f33, transparent: true, opacity: 0.12, depthWrite: false })
      );
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = -0.1;
      shadow.scale.set(1, 0.45, 1);
      scene.add(shadow);

      // pivot: this group moves/rotates with sensor data
      const pivot = new THREE.Group();
      scene.add(pivot);

      const buildFallbackGlasses = () => {
        const g = new THREE.Group();
        const frame = new THREE.MeshStandardMaterial({ color: 0x1a1f33, roughness: 0.4 });
        const lens = new THREE.MeshStandardMaterial({ color: 0x3a45f5, transparent: true, opacity: 0.35 });
        [-0.045, 0.045].forEach((x) => {
          const ring = new THREE.Mesh(new THREE.TorusGeometry(0.035, 0.006, 12, 40), frame);
          ring.position.x = x;
          const l = new THREE.Mesh(new THREE.CircleGeometry(0.035, 32), lens);
          l.position.x = x;
          const arm = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.006, 0.12), frame);
          arm.position.set(x * 1.95, 0.01, -0.06);
          g.add(ring, l, arm);
        });
        const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.006, 0.006), frame);
        bridge.position.y = 0.012;
        g.add(bridge);
        return g;
      };

      new GLTFLoader().load(
        "./assets/3d/glasses.glb",
        (gltf) => pivot.add(gltf.scene),
        undefined,
        () => { console.warn("glasses.glb not found, using placeholder"); pivot.add(buildFallbackGlasses()); }
      );

      // sensor-driven targets (smoothed each frame)
      const targetPos = new THREE.Vector3();
      const targetQuat = new THREE.Quaternion();
      const tmpEuler = new THREE.Euler();

      const setTargetPosition = (a) => {
        const { x, y, z } = a ?? { x: 0, y: 0, z: 0 };
        targetPos.set(x, y, z).multiplyScalar(0.003).add(new THREE.Vector3(0, 0, 0.005));
      };
      const setTargetRotation = (o) => {
        const { pitch, heading, roll } = o ?? { pitch: 0, heading: 0, roll: 0 };
        tmpEuler.set(THREE.MathUtils.degToRad(pitch), THREE.MathUtils.degToRad(heading), THREE.MathUtils.degToRad(roll), "YXZ");
        targetQuat.setFromEuler(tmpEuler);
      };
      setTargetPosition(); setTargetRotation();

      const resize = () => {
        const { clientWidth: w, clientHeight: h } = canvas;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      };
      new ResizeObserver(resize).observe(canvas);
      resize();

      renderer.setAnimationLoop(() => {
        pivot.position.lerp(targetPos, 0.25);
        pivot.quaternion.slerp(targetQuat, 0.25);
        controls.update();
        renderer.render(scene, camera);
      });

      // ---------- SENSOR UI ----------
      const fmt = (n, d = 1) => (Number.isFinite(n) ? n.toFixed(d) : "0.0");
      const buildRows = (container, labels, unit) => {
        container.innerHTML = labels
          .map((l) => `<div class="row"><span>${l}</span><div class="track"><div class="fill"></div></div><b>0.0${unit}</b></div>`)
          .join("");
        return [...container.querySelectorAll(".row")].map((r) => ({ fill: r.querySelector(".fill"), val: r.querySelector("b") }));
      };
      const setRow = (row, v, range, unit) => {
        const p = Math.max(-1, Math.min(1, v / range));
        row.fill.style.left = `${50 + Math.min(0, p) * 50}%`;
        row.fill.style.width = `${Math.abs(p) * 50}%`;
        row.val.textContent = fmt(v) + unit;
      };

      const orientationEl = $("orientationData");
      const accelerationEl = $("accelerationData");
      let orientationRows, accelerationRows;

      const setupToggle = (type, button, onConfigChange, onData) => {
        button.addEventListener("click", () => getDevice()?.toggleSensor(type, 20));
        const refresh = () => {
          const device = getDevice();
          const connected = Boolean(device?.isConnected);
          button.disabled = !connected;
          button.setAttribute("aria-checked", String(connected && device.sensorConfiguration[type] > 0));
        };
        onPMSGDeviceIsConnected((device, isConnected) => {
          refresh();
          if (!isConnected) return;
          const opts = { signal: device.connectionAbortSignal };
          device.addEventListener("getSensorConfiguration", () => { refresh(); onConfigChange(device); }, opts);
          device.addEventListener(type, (e) => onData(e.message), opts);
        });
        refresh();
      };

      setupToggle("orientation", $("toggleOrientation"),
        () => setTargetRotation(),
        ({ orientation }) => {
          if (!orientationRows) orientationRows = buildRows(orientationEl, ["Pitch", "Heading", "Roll"], "°");
          setRow(orientationRows[0], orientation.pitch, 180, "°");
          setRow(orientationRows[1], orientation.heading, 180, "°");
          setRow(orientationRows[2], orientation.roll, 180, "°");
          setTargetRotation(orientation);
        });

      setupToggle("acceleration", $("toggleAcceleration"),
        () => setTargetPosition(),
        ({ acceleration }) => {
          if (!accelerationRows) accelerationRows = buildRows(accelerationEl, ["X", "Y", "Z"], "");
          setRow(accelerationRows[0], acceleration.x, 20, "");
          setRow(accelerationRows[1], acceleration.y, 20, "");
          setRow(accelerationRows[2], acceleration.z, 20, "");
          setTargetPosition(acceleration);
        });

      let taps = 0;
      setupToggle("tapDetector", $("toggleTapDetector"),
        () => {},
        ({ timestamp }) => {
          taps++;
          $("tapCount").textContent = taps;
          $("tapMeta").textContent = `Last tap at ${new Date().toLocaleTimeString()} (device time ${timestamp})`;
          const pulse = $("pulse");
          pulse.classList.remove("go");
          void pulse.offsetWidth;
          pulse.classList.add("go");
        });
    </script>
  </body>
</html>
